
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  # Missing hashed assets (old deploy / stale service worker) must return a
  # clean 404 instead of index.html — otherwise the browser tries to execute
  # index.html as a JS module ("MIME type text/html" error).
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' *.supabase.co *.netlify.app; script-src 'self' 'unsafe-inline' *.google.com *.googleapis.com *.gstatic.com; style-src 'self' 'unsafe-inline' *.googleapis.com; font-src 'self' *.gstatic.com *.googleapis.com data:; img-src 'self' data: blob: *.supabase.co *.google.com *.googleusercontent.com; connect-src 'self' *.supabase.co wss://*.supabase.co *.openrouter.ai *.google.com *.googleapis.com https://vpic.nhtsa.dot.gov; frame-src 'self' *.google.com; manifest-src 'self' *.netlify.app; object-src 'none';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
