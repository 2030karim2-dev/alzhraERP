
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' *.supabase.co *.netlify.app; script-src 'self' 'unsafe-inline' *.google.com *.googleapis.com *.gstatic.com; style-src 'self' 'unsafe-inline' *.googleapis.com; font-src 'self' *.gstatic.com *.googleapis.com data:; img-src 'self' data: blob: *.supabase.co *.google.com *.googleusercontent.com; media-src 'self' data: blob: https://cdn.islamic.network https://*.islamic.network https://*.archive.org https://archive.org *.supabase.co https://*.supabase.co; connect-src 'self' https://zzthamxjxnxzzpswllid.supabase.co wss://zzthamxjxnxzzpswllid.supabase.co *.supabase.co wss://*.supabase.co https://cdn.islamic.network https://*.islamic.network https://*.archive.org https://archive.org https://api.deepseek.com https://openrouter.ai https://*.openrouter.ai *.google.com *.googleapis.com https://vpic.nhtsa.dot.gov; frame-src 'self' *.google.com; frame-ancestors 'self'; manifest-src 'self' *.netlify.app; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
