name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alzhraERP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alzhraERP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Encoding guard (Arabic mojibake check)
        run: npm run check:encoding

      - name: TypeScript ratchet (no NEW errors beyond baseline)
        run: npx tsx scripts/check-ts-baseline.ts

      - name: Lint (non-blocking — lint debt tracked separately)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
