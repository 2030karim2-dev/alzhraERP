name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alzhraERP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alzhraERP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Encoding guard (Arabic mojibake check)
        run: npm run check:encoding

      - name: TypeScript ratchet (no NEW errors beyond baseline)
        run: npx tsx scripts/check-ts-baseline.ts

      - name: Lint (non-blocking — make blocking once lint debt is paid)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the `base` commit (previous SHA / PR base) is
          # actually present in the local repo for TruffleHog to diff against.
          fetch-depth: 0

      # base/head must differ for TruffleHog to scan. For pushes to main,
      # `github.event.before`/`github.sha` give the pre-push and pushed SHAs.
      # For pull requests we use the PR base/head SHAs. The old config passed
      # `base: main` + `head: HEAD`, which are the SAME commit on a push to
      # main → TruffleHog refused to scan and the job always failed.
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
