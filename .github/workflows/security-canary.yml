name: Security Canary

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  canary:
    name: Security canary (audit views + canary SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Supabase DB connection string for the staging project.
      # Stored as a GitHub Actions secret. The CI runner does NOT
      # have write access to production.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      # psql client version pinned in the runner image
      PGPASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify required secrets are present
        if: env.SUPABASE_DB_URL == ''
        run: |
          echo "::error::SUPABASE_STAGING_DB_URL is not set."
          exit 1

      # Every psql step MUST use ON_ERROR_STOP=1: a SQL error aborts the run
      # and fails the step. Output is accumulated with `tee -a` into
      # sql_output.log so the final grep can catch logical CANARY FAIL lines
      # that the test scripts print without raising a SQL error.
      - name: Run canary SQL
        run: |
          set -euo pipefail
          rm -f sql_output.log
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_canary_all_audit_views.sql 2>&1 | tee -a sql_output.log

      - name: Run security authorization tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_security_authorization.sql 2>&1 | tee -a sql_output.log

      - name: Run RLS isolation tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_rls_isolation.sql 2>&1 | tee -a sql_output.log

      - name: Run audit trail tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_audit_trail.sql 2>&1 | tee -a sql_output.log

      - name: Run injection / XSS tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_injection_xss.sql 2>&1 | tee -a sql_output.log

      - name: Run business logic tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_business_logic.sql 2>&1 | tee -a sql_output.log

      - name: Run api_v1 cross-tenant tests
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f supabase/tests/test_api_v1_cross_tenant.sql 2>&1 | tee -a sql_output.log

      # Double gate: even if a psql step somehow exits 0, any printed
      # "CANARY FAIL" line in the accumulated log fails the workflow.
      - name: Fail on any CANARY FAIL
        run: |
          set -euo pipefail
          if [ ! -f sql_output.log ]; then
            echo "::error::sql_output.log was never created — canary steps did not run."
            exit 1
          fi
          if grep -q "CANARY FAIL" sql_output.log; then
            echo "::error::One or more security canaries failed."
            grep "CANARY FAIL" sql_output.log
            exit 1
          fi
          echo "All canaries passed."
